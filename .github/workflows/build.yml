name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore APEX.DevTools.sln --locked-mode
      - name: Build both applications and tests
        run: dotnet build APEX.DevTools.sln -c Release --no-restore -warnaserror
      - name: Test on the Windows .NET Framework runtime
        run: dotnet test tests/APEX.Compiler.Tests/APEX.Compiler.Tests.csproj -c Release -f net48 --no-build --no-restore --logger "trx;LogFileName=net48.trx"
      - name: Test the portable compiler core
        run: dotnet test tests/APEX.Compiler.Tests/APEX.Compiler.Tests.csproj -c Release -f net10.0 --no-build --no-restore --logger "trx;LogFileName=net10.trx"
      - name: Package runtime archives
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Scan packages with current Microsoft Defender definitions
        shell: pwsh
        run: |
          $scanFolder = 'artifacts/_scan-' + [guid]::NewGuid().ToString('N')
          try {
            foreach ($zip in Get-ChildItem artifacts -File -Filter '*.zip') {
              Expand-Archive $zip.FullName (Join-Path $scanFolder $zip.BaseName)
            }
            ./scripts/scan-release.ps1 -Path artifacts -ReportDirectory artifacts/antivirus
          } finally {
            if (Test-Path $scanFolder) { Remove-Item $scanFolder -Recurse -Force }
          }
      - name: Smoke-test extracted archives
        shell: pwsh
        run: ./scripts/smoke-test-packages.ps1
      - name: Upload verified packages and test reports
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apex-build
          if-no-files-found: warn
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/gui-preview/*.png
            tests/**/TestResults/*.trx
            artifacts/antivirus/*
      - name: Preserve validation reports when a check fails
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apex-validation-reports
          if-no-files-found: warn
          path: |
            tests/**/TestResults/*.trx
            artifacts/gui-preview/*.png
            artifacts/antivirus/*
